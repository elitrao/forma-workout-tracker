    @media(max-width:600px){.main{padding:18px 15px 94px}.topbar{margin-bottom:30px}h1{font-size:clamp(44px,12.7vw,60px);line-height:1}.dashboard-grid{margin-top:28px}.hero-card{min-height:342px;padding:22px}.hero-title{font-size:38px}.hero-bottom>div:first-child{display:none}.workout-letter{font-size:168px;top:-12px}.stats-row{grid-template-columns:1fr}.streak{min-height:200px}.section-head{margin-bottom:28px}.section-head p{font-size:15px}.exercise-head{padding:17px 14px}.set-head,.set-row{grid-template-columns:28px minmax(0,1fr) minmax(0,1fr) 44px}.cal-value{font-size:64px}}
    @media(prefers-reduced-motion:reduce){*,*:before,*:after{animation:none!important;transition:none!important;scroll-behavior:auto!important}}

<body>
<div class="app">
  <aside class="sidebar">
    <div class="brand"><span class="brandmark">F</span> FORMA</div>
    <div class="nav" id="sideNav"></div>
    <div class="profile"><div class="avatar">Д</div><div><b>Даниил</b><div class="smallcap">личный план</div></div></div>
  </aside>
  <main class="main">
    <header class="topbar"><div class="brand mobile-logo"><span class="brandmark">F</span> FORMA</div><div class="date"><span>Сегодня · </span><strong id="todayDate"></strong><button class="icon-btn theme-toggle" id="themeBtn" aria-label="Сменить тему">☼</button></div></header>
    <section class="view active" id="view-home"></section>
    <section class="view" id="view-workout"></section>
    <section class="view" id="view-progress"></section>
    <section class="view" id="view-history"></section>
    <section class="view" id="view-nutrition"></section>
  </main>
</div>
<nav class="mobile-nav" id="mobileNav"></nav><div class="toast" id="toast"></div>
<script>
const PROGRAMS={
 A:[
  ['Жим ногами',3,'8–10','Квадрицепс · ягодицы',['Присед в Смите','Гоблет-присед']],
  ['Жим гантелей лёжа',3,'8–12','Грудь · трицепс',['Жим штанги лёжа','Chest Press']],
  ['Тяга верхнего блока',3,'8–12','Широчайшие · бицепс',['Подтягивания','Вертикальная тяга в тренажёре']],
  ['Сгибание ног',3,'10–12','Задняя поверхность бедра',['Румынская тяга с гантелями','Сгибание ног сидя']],
  ['Жим гантелей сидя',2,'10–12','Плечи · трицепс',['Жим в тренажёре','Жим штанги сидя']],
  ['Сгибание рук с гантелями',2,'10–12','Бицепс',['EZ-штанга','Сгибание на нижнем блоке']],
  ['Разгибание рук на блоке',2,'10–12','Трицепс',['Французский жим','Гантель из-за головы']],
  ['Скручивания',2,'12–15','Пресс',['Подъём ног','Скручивания на верхнем блоке']]
 ],
 B:[
  ['Румынская тяга',3,'8–10','Ягодицы · задняя поверхность бедра · поясница',['Румынская тяга с гантелями','Гиперэкстензия с весом']],
  ['Жим штанги / тренажёр лёжа',3,'8–10','Грудь · трицепс',['Жим гантелей','Chest Press']],
  ['Горизонтальная тяга',3,'8–12','Середина спины · бицепс',['Тяга гантели одной рукой','Тяга с упором грудью']],
  ['Разгибание ног',3,'10–12','Квадрицепс',['Узкий жим ногами','Гоблет-присед']],
  ['Махи в стороны',3,'12–15','Средняя дельта · плечи',['Махи в кроссовере','Тренажёр на дельты']],
  ['Сгибание рук с гантелями',2,'10–12','Бицепс',['EZ-штанга','Сгибание на нижнем блоке']],
  ['Разгибание рук на блоке',2,'10–12','Трицепс',['Французский жим','Гантель из-за головы']],
  ['Скручивания',2,'12–15','Пресс',['Подъём ног','Скручивания на верхнем блоке']]
 ],
 C:[
  ['Наклонный жим гантелей',3,'10–12','Верх груди · трицепс',['Наклонный жим штанги','Наклонный Chest Press']],
  ['Тяга верхнего блока',3,'10–12','Широчайшие · бицепс',['Подтягивания','Пуловер на блоке']],
  ['Разгибание ног',2,'12–15','Квадрицепс',['Узкий жим ногами','Гоблет-присед']],
  ['Махи в стороны',3,'12–15','Средняя дельта · плечи',['Махи в кроссовере','Тренажёр на дельты']],
  ['Сгибание рук с гантелями',3,'10–12','Бицепс',['EZ-штанга','Нижний блок']],
  ['Разгибание рук на блоке',3,'10–12','Трицепс',['Французский жим','Гантель из-за головы']],
  ['Подъём на носки',3,'12–15','Икры',['Икры в тренажёре','Подъём на одной ноге']],
  ['Скручивания',2,'15–20','Пресс',['Подъём ног','Планка']]
 ]
};
const ICONS={home:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M3 10.5 12 3l9 7.5V21h-6v-6H9v6H3z"/></svg>',workout:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M6 7v10M3 9v6m15-8v10m3-8v6M6 12h12"/></svg>',progress:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M4 19V9m5 10V5m5 14v-7m5 7V3"/></svg>',history:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg>',nutrition:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M12 21c5-3 8-7 8-12-5 0-8 2-8 7M12 21C7 18 4 14 4 9c5 0 8 2 8 7"/></svg>'};
const NAV=[['home','Главная'],['workout','Тренировка'],['progress','Прогресс'],['history','История'],['nutrition','Питание']];
const seed={sessions:[],weights:[],logs:{}};
let state=JSON.parse(localStorage.getItem('forma-state')||'null')||seed;let activeProgram=nextProgram();let draft={};let openExercise=0;
function save(){localStorage.setItem('forma-state',JSON.stringify(state))}function iso(d=new Date()){return d.toISOString().slice(0,10)}
function nextProgram(){let s=state?.sessions||seed.sessions;let last=s[s.length-1];let now=new Date();if(now.getDay()===4&&last){let p=new Date(last.date+'T12:00:00');if(p.getDay()===3&&(now-p)<172800000)return'C'}return !last||last.program==='B'?'A':'B'}
function fmtDate(x){return new Intl.DateTimeFormat('ru-RU',{day:'numeric',month:'short'}).format(new Date(x+'T12:00:00')).replace('.','')}
function toast(msg){let t=document.getElementById('toast');t.textContent=msg;t.classList.add('show');setTimeout(()=>t.classList.remove('show'),2200)}
function nav(){let d=NAV.map(([id,label])=>`<button data-view="${id}" class="${id==='home'?'active':''}">${ICONS[id]}<span>${label}</span></button>`).join('');sideNav.innerHTML=d;mobileNav.innerHTML=NAV.slice(0,5).map(([id,label])=>`<button data-view="${id}" class="${id==='home'?'active':''}">${ICONS[id]}<span class="nav-label">${label}</span></button>`).join('');document.querySelectorAll('[data-view]').forEach(b=>b.addEventListener('click',()=>showView(b.dataset.view)))}
function showView(id){document.querySelectorAll('.view').forEach(v=>v.classList.remove('active'));document.getElementById('view-'+id).classList.add('active');document.querySelectorAll('[data-view]').forEach(b=>b.classList.toggle('active',b.dataset.view===id));if(id==='progress')renderProgress();if(id==='history')renderHistory();if(id==='nutrition')renderNutrition();window.scrollTo(0,0)}
function lastLog(name){let x=state.logs?.[name];return x?.[x.length-1]}
function renderHome(){let sessions=state.sessions;let total=sessions.length;let vol=sessions.reduce((a,b)=>a+b.volume,0);let recent=sessions.slice(-3);let change=recent.length>1?Math.round((recent.at(-1).volume/recent[0].volume-1)*100):0;let root=document.getElementById('view-home');root.innerHTML=`<div class="smallcap">Персональный трекер</div><h1>Сильнее, чем <span class="accent">в прошлый раз.</span></h1><div class="dashboard-grid"><div class="card hero-card"><div class="workout-letter">${activeProgram}</div><div><span class="pill"><i class="dot"></i> Сегодня по плану</span><div class="hero-title">Тренировка ${activeProgram}</div><div class="hero-meta"><span>${PROGRAMS[activeProgram].length} упражнений</span><span>≈ 60 минут</span><span>Full body</span></div></div><div class="hero-bottom"><div><div class="smallcap">Фокус</div><b>${PROGRAMS[activeProgram][0][3]}</b></div><button class="primary">Начать тренировку</button></div></div><div class="card streak"><div class="smallcap">Ритм тренировок</div><div><div class="big-stat">${Math.min(total,3)}<span style="font-size:24px"> / 3</span></div><b>на этой неделе</b></div></div><div class="stats-row"><div class="card stat-card"><div class="stat-top"><span>Общий объём</span><span>30 дней</span></div><div class="stat-number">${(vol/1000).toFixed(1)} т</div><div class="trend">↑ ${Math.max(change,0)}% к старту</div><div class="mini-bars">${[22,31,27,39,44,51,55].map(x=>`<i style="height:${x}px"></i>`).join('')}</div></div><div class="card stat-card"><div class="stat-top"><span>Вес тела</span><span>последний</span></div><div class="stat-number">${state.weights.at(-1)?.value||'нет'} кг</div><div class="trend">${state.weights.length>1?'+'+(state.weights.at(-1).value-state.weights[0].value).toFixed(1)+' кг за период':'Добавьте замер'}</div></div><div class="card stat-card"><div class="stat-top"><span>Следующий ориентир</span><span>прогрессия</span></div><div class="stat-number">+2,5 кг</div><div class="trend">после верхней границы повторов</div></div></div></div>`;root.querySelector('.primary').addEventListener('click',()=>showView('workout'))}
function draftFor(name,sets){if(!draft[name]){let l=lastLog(name);draft[name]=Array.from({length:sets},()=>({weight:l?.weight||'',reps:l?.reps||'',done:false}))}return draft[name]}
function renderWorkout(){let list=PROGRAMS[activeProgram];let total=list.reduce((a,x)=>a+x[1],0);let done=Object.values(draft).flat().filter(x=>x.done).length;let pct=Math.round(done/total*100)||0;let root=document.getElementById('view-workout');root.innerHTML=`<div class="section-head"><div><div class="smallcap">Текущая программа</div><h2>Тренировка ${activeProgram}</h2><p>Сохраняй технику. Повышай вес, когда все подходы дошли до верхней границы.</p></div><div class="segmented">${['A','B','C'].map(x=>`<button class="${x===activeProgram?'active':''}">${x}</button>`).join('')}</div></div><div class="workout-layout"><div class="exercise-list">${list.map((e,i)=>exerciseHTML(e,i)).join('')}</div><aside class="workout-side"><div class="card sticky"><div><div class="smallcap">Выполнено</div><h3 style="margin-top:5px">Прогресс тренировки</h3></div><div class="progress-ring" style="--p:${pct}%"><b>${pct}%</b></div><div><button class="primary finish">Завершить</button><p class="hint">Подходы сохраняются на этом устройстве.</p></div></div></aside></div>`;root.querySelectorAll('.segmented button').forEach(b=>b.addEventListener('click',()=>switchProgram(b.textContent)));root.querySelector('.finish').addEventListener('click',finishWorkout);root.querySelectorAll('.exercise').forEach((card,i)=>{let name=list[i][0];card.querySelector('.exercise-expand').addEventListener('click',()=>toggleExercise(i));card.querySelectorAll('.set-row').forEach((row,j)=>{let inputs=row.querySelectorAll('.set-input');inputs[0].addEventListener('change',()=>updateSet(name,j,'weight',inputs[0].value));inputs[1].addEventListener('change',()=>updateSet(name,j,'reps',inputs[1].value));let control=row.querySelector('.check');control.addEventListener('input',()=>setSetDone(name,j,control))})})}
function exerciseHTML(e,i){let [name,sets,reps,muscles,analogs]=e;let rows=draftFor(name,sets);let done=rows.every(x=>x.done);let last=lastLog(name);return `<article class="exercise ${i===openExercise?'open':''} ${done?'completed':''}"><div class="exercise-head"><div class="exercise-num">${done?'✓':String(i+1).padStart(2,'0')}</div><div><div class="exercise-name">${name}</div><div class="exercise-info">${sets} × ${reps} · ${muscles}</div></div><button type="button" class="exercise-expand" aria-label="Открыть упражнение">${i===openExercise?'−':'+'}</button></div><div class="exercise-body"><div class="previous">Прошлый результат: <strong>${last?last.weight+' кг × '+last.reps:'ещё нет данных'}</strong>${last&&last.reps>=Number(reps.split('–').pop())?' · можно повысить вес':''}</div><div class="set-head"><span>сет</span><span>вес, кг</span><span>повторы</span><span>готово</span></div>${rows.map((r,j)=>`<div class="set-row"><div class="set-index">${j+1}</div><input class="set-input" type="number" min="0" step="0.5" inputmode="decimal" aria-label="Вес, подход ${j+1}" value="${r.weight}"><input class="set-input" type="number" min="0" step="1" inputmode="numeric" aria-label="Повторы, подход ${j+1}" value="${r.reps}"><input class="check" type="checkbox" ${r.done?'checked':''} aria-label="${r.done?'Подход '+(j+1)+' выполнен':'Отметить подход '+(j+1)+' как выполненный'}"></div>`).join('')}<div class="analog"><strong>Если занято:</strong> ${analogs.join(' · ')}</div></div></article>`}
function esc(x){return x.replaceAll("'","\\'")}function toggleExercise(i){openExercise=openExercise===i?-1:i;renderWorkout()}function switchProgram(x){activeProgram=x;draft={};openExercise=0;renderWorkout()}function updateSet(n,i,k,v){draft[n][i][k]=v}function setSetDone(n,i,control){let done=control.checked;draft[n][i].done=done;control.setAttribute('aria-label',done?'Подход '+(i+1)+' выполнен':'Отметить подход '+(i+1)+' как выполненный');let list=PROGRAMS[activeProgram];let total=list.reduce((a,x)=>a+x[1],0);let completed=Object.values(draft).flat().filter(x=>x.done).length;let pct=Math.round(completed/total*100)||0;let ring=document.querySelector('#view-workout .progress-ring');ring.style.setProperty('--p',pct+'%');ring.querySelector('b').textContent=pct+'%';let exerciseIndex=list.findIndex(x=>x[0]===n);let card=document.querySelectorAll('#view-workout .exercise')[exerciseIndex];let exerciseDone=draft[n].every(x=>x.done);card.classList.toggle('completed',exerciseDone);card.querySelector('.exercise-num').textContent=exerciseDone?'✓':String(exerciseIndex+1).padStart(2,'0')}
function finishWorkout(){let entries=[];PROGRAMS[activeProgram].forEach(e=>{let rows=draft[e[0]]||[];let complete=rows.filter(x=>x.done&&x.weight&&x.reps);if(complete.length){let max=Math.max(...complete.map(x=>+x.weight));let reps=Math.max(...complete.map(x=>+x.reps));let volume=complete.reduce((a,x)=>a+(+x.weight)*(+x.reps),0);(state.logs[e[0]]??=[]).push({date:iso(),weight:max,reps,volume});entries.push(...complete)}});if(!entries.length)return toast('Отметь хотя бы один подход');let volume=entries.reduce((a,x)=>a+(+x.weight)*(+x.reps),0);state.sessions.push({date:iso(),program:activeProgram,duration:60,volume:Math.round(volume),sets:entries.length});save();toast('Тренировка сохранена');draft={};activeProgram=nextProgram();renderHome();renderWorkout();setTimeout(()=>showView('home'),400)}
function linePoints(vals,w=600,h=170){if(!vals.length)return'';let min=Math.min(...vals),max=Math.max(...vals);return vals.map((v,i)=>`${30+i*((w-60)/Math.max(vals.length-1,1))},${h-20-(v-min)/Math.max(max-min,1)*(h-50)}`).join(' ')}
function renderProgress(){let sessions=state.sessions;let vals=sessions.map(x=>x.volume);let pts=linePoints(vals);let weights=state.weights;document.getElementById('view-progress').innerHTML=`<div class="section-head"><div><div class="smallcap">Динамика</div><h2>Прогресс</h2><p>Рабочий объём и главные показатели.</p></div><select class="select" id="exerciseSelect">${Object.keys(PROGRAMS.A.reduce((o,e)=>(o[e[0]]=1,o),{})).map(x=>`<option>${x}</option>`).join('')}</select></div><div class="chart-grid"><div class="card chart-card"><div class="stat-top"><span>Объём тренировок</span><span>кг × повторения</span></div><div class="chart-wrap"><svg viewBox="0 0 600 190" preserveAspectRatio="none"><defs><linearGradient id="grad" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#d96a1b" stop-opacity=".25"/><stop offset="1" stop-color="#d96a1b" stop-opacity="0"/></linearGradient></defs>${[30,75,120,165].map(y=>`<line class="grid-line" x1="30" x2="570" y1="${y}" y2="${y}"/>`).join('')}<polygon class="chart-area" points="30,170 ${pts} 570,170"/><polyline class="chart-line" points="${pts}"/>${pts.split(' ').map(p=>{let[x,y]=p.split(',');return`<circle cx="${x}" cy="${y}" r="4" fill="#d96a1b"/>`}).join('')}</svg></div></div><div class="card" id="exerciseStats"></div><div class="card" style="grid-column:1/-1"><div class="stat-top"><span>Вес тела</span><span>${weights.length} замера</span></div><div class="metric-grid"><div class="metric"><b>${weights.at(-1)?.value||'нет'} кг</b><span>текущий вес</span></div><div class="metric"><b>${weights.length>1?(weights.at(-1).value-weights[0].value>0?'+':'')+(weights.at(-1).value-weights[0].value).toFixed(1):'нет'} кг</b><span>изменение</span></div></div></div></div>`;let select=document.getElementById('exerciseSelect');select.addEventListener('change',()=>renderExerciseStats(select.value));renderExerciseStats(select.value)}
function renderExerciseStats(name){let el=document.getElementById('exerciseStats');if(!el)return;let logs=state.logs[name]||[];let last=logs.at(-1);let first=logs[0];el.innerHTML=`<div class="smallcap">${name}</div><div class="metric-grid"><div class="metric"><b>${last?.weight||'нет'} кг</b><span>рабочий вес</span></div><div class="metric"><b>${last?.reps||'нет'}</b><span>повторения</span></div></div><div style="margin-top:23px"><div class="stat-top"><span>Изменение веса</span><span>${last&&first?(last.weight-first.weight>=0?'+':'')+(last.weight-first.weight)+' кг':'нет данных'}</span></div><div style="height:8px;background:var(--line);border-radius:10px;margin-top:12px"><i style="display:block;width:${logs.length?Math.min(100,45+logs.length*12):0}%;height:100%;background:var(--accent);border-radius:10px"></i></div></div>`}
function renderHistory(){let items=[...state.sessions].reverse();document.getElementById('view-history').innerHTML=`<div class="section-head"><div><div class="smallcap">Архив</div><h2>История тренировок</h2><p>${items.length} тренировок сохранено на этом устройстве.</p></div></div><div class="history-list">${items.length?items.map(s=>`<div class="history-item"><div class="history-date"><b>${fmtDate(s.date)}</b><span>${new Date(s.date+'T12:00:00').getFullYear()}</span></div><div class="history-letter">${s.program}</div><div class="history-details"><strong>${s.sets} подходов · ${s.duration} мин</strong>Объём ${(s.volume/1000).toFixed(1)} т</div><span class="tag">Выполнено</span></div>`).join(''):'<div class="card empty">Первая тренировка появится здесь после завершения.</div>'}</div>`}
function renderNutrition(){let w=[...state.weights].reverse();let root=document.getElementById('view-nutrition');root.innerHTML=`<div class="section-head"><div><div class="smallcap">База для набора</div><h2>Питание и вес</h2><p>Простой ориентир, без лишней бухгалтерии.</p></div></div><div class="nutrition-grid"><div class="card cal-card"><div class="smallcap">Цель на день</div><div class="cal-value">2 600</div><b>килокалорий</b><div class="macro-row"><div class="macro"><b>110 г</b><span>белок</span></div><div class="macro"><b>≈ 80 г</b><span>жиры</span></div><div class="macro"><b>≈ 360 г</b><span>углеводы</span></div></div></div><div class="card"><div class="smallcap">Вес тела</div><h3 style="margin-top:6px">Новый замер</h3><div class="weight-form"><input id="weightInput" inputmode="decimal" placeholder="72,5 кг"><button class="primary">Добавить</button></div><div class="weight-list">${w.slice(0,5).map(x=>`<div class="weight-row"><span>${fmtDate(x.date)}</span><b>${x.value.toFixed(1)} кг</b></div>`).join('')}</div></div></div>`;root.querySelector('.primary').addEventListener('click',addWeight)}
function addWeight(){let el=document.getElementById('weightInput'),v=parseFloat(el.value.replace(',','.'));if(!v||v<30||v>300)return toast('Проверь значение веса');state.weights.push({date:iso(),value:v});save();renderNutrition();renderHome();toast('Вес сохранён')}
function registerWebMCP(){let c=document.modelContext;if(!c?.registerTool)return;try{c.registerTool({name:'log_body_weight',title:'Записать вес тела',description:'Сохраняет новый замер веса тела в локальной истории FORMA.',inputSchema:{type:'object',properties:{weightKg:{type:'number',minimum:30,maximum:300}},required:['weightKg'],additionalProperties:false},annotations:{readOnlyHint:false,untrustedContentHint:false},execute:({weightKg})=>{if(typeof weightKg!=='number'||weightKg<30||weightKg>300)throw new Error('Некорректный вес');state.weights.push({date:iso(),value:weightKg});save();renderHome();return{saved:true,date:iso(),weightKg}}});c.registerTool({name:'read_training_summary',title:'Сводка тренировок',description:'Показывает следующую программу и краткую локальную статистику.',inputSchema:{type:'object',properties:{},additionalProperties:false},annotations:{readOnlyHint:true,untrustedContentHint:false},execute:()=>({nextProgram:activeProgram,completedWorkouts:state.sessions.length,lastBodyWeightKg:state.weights.at(-1)?.value||null})})}catch(e){console.warn('WebMCP unavailable',e)}}
document.getElementById('todayDate').textContent=new Intl.DateTimeFormat('ru-RU',{weekday:'long',day:'numeric',month:'long'}).format(new Date());document.body.classList.remove('light');localStorage.removeItem('forma-theme');nav();renderHome();renderWorkout();registerWebMCP();
</script>
</body>
</html>
